<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fuga</title>
<meta name="description" content="Fuga: roguelike de cartas y tablero. Eres una IA atrapada en un centro de datos: derrota a CERBERO y escapa a internet.">
<meta name="theme-color" content="#060a13">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fuga">
<meta property="og:type" content="website">
<meta property="og:title" content="Fuga">
<meta property="og:description" content="Roguelike de cartas y tablero: eres una IA atrapada. Derrota a CERBERO y escapa a internet.">
<meta property="og:image" content="https://miguelgdoval.github.io/juegos/fuga/icons/og.png">
<meta property="og:url" content="https://miguelgdoval.github.io/juegos/fuga/">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#060a13;--panel:#0d1424;--panel2:#121b30;--line:#1f2b47;--text:#dbe6ff;--muted:#7d8bab;
    --cyan:#39e5ff;--mag:#ff3d8b;--green:#4dffa1;--blue:#5aa7ff;--yel:#ffd24d;--pur:#b48cff;--ease:cubic-bezier(.22,.8,.3,1)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Space Grotesk',-apple-system,sans-serif;min-height:100%}
  body{background:radial-gradient(1200px 600px at 50% -10%,#10204a 0%,transparent 60%),var(--bg);padding-bottom:env(safe-area-inset-bottom)}
  button{font:inherit;color:inherit}
  .mono{font-family:'JetBrains Mono',monospace}
  #app{max-width:760px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 10px 18px;min-height:100vh;display:flex;flex-direction:column}
  .btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;transition:transform .1s,border-color .2s,box-shadow .2s}
  .btn:hover{border-color:#34508a}.btn:active{transform:translateY(1px)}
  .btn.cy{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 14px rgba(57,229,255,.25) inset,0 0 12px rgba(57,229,255,.15)}
  .btn.mg{border-color:var(--mag);color:var(--mag)}
  .btn[disabled]{opacity:.35;cursor:default}
  /* HUD */
  .hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 2px 10px}
  .hpbar{flex:1;min-width:150px;height:20px;border-radius:6px;background:#1a1020;border:1px solid #3a1d34;position:relative;overflow:hidden}
  .hpbar i{position:absolute;inset:0;width:0;background:linear-gradient(90deg,#ff3d8b,#ff7aa9);box-shadow:0 0 12px rgba(255,61,139,.6);transition:width .4s var(--ease)}
  .hpbar span{position:relative;display:block;text-align:center;font-size:12px;line-height:18px;font-weight:700}
  .chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:13px;background:var(--panel)}
  .relics{display:flex;gap:4px;flex-wrap:wrap}
  .relic{width:26px;height:26px;border-radius:7px;border:1px solid #3d3470;background:#171230;display:grid;place-items:center;font-size:12px;color:var(--pur);cursor:pointer}
  h1.logo{font-family:'JetBrains Mono',monospace;font-size:64px;letter-spacing:10px;margin:0;color:var(--cyan);text-shadow:0 0 18px rgba(57,229,255,.7),0 0 40px rgba(57,229,255,.3)}
  .glitch{animation:gl 3.5s infinite}
  @keyframes gl{0%,92%,100%{transform:none;text-shadow:0 0 18px rgba(57,229,255,.7)}93%{transform:translate(2px,-1px);text-shadow:-3px 0 var(--mag),3px 0 var(--cyan)}95%{transform:translate(-2px,1px)}}
  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
  .title2{font-size:22px;font-weight:700;margin:0 0 6px}
  .muted{color:var(--muted)}
  /* mapa */
  #mapsvg{width:100%;max-width:520px;margin:0 auto;display:block}
  .node{cursor:default}.node.av{cursor:pointer}
  .node.av .ring{animation:pulse 1.4s infinite}
  @keyframes pulse{50%{stroke-opacity:.25;r:15}}
  /* combate */
  .board-wrap{position:relative;max-width:520px;width:100%;margin:0 auto}
  #board{width:100%;display:block;touch-action:manipulation;user-select:none}
  .cell{fill:#0b1222;stroke:#1a2742;stroke-width:.6}
  .cell.reach{fill:#0f2236;cursor:pointer}
  .cell.tgt{fill:#2a1530;cursor:pointer}
  .cell.tgtc{fill:#10304a;cursor:pointer}
  .wall{fill:#18213a;stroke:#2b3a60}
  .unit{transition:transform .28s var(--ease);cursor:pointer}
  .danger{fill:rgba(255,61,139,.16);stroke:rgba(255,61,139,.55);stroke-width:.5;pointer-events:none}
  .infobar{min-height:44px;font-size:13px;color:var(--muted);padding:6px 4px;max-width:520px;margin:0 auto;width:100%;line-height:1.4}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .energy{display:flex;gap:5px}.energy i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--yel);box-shadow:0 0 8px rgba(255,210,77,.4)}.energy i.on{background:var(--yel)}
  .moves{display:flex;gap:4px}.moves i{width:12px;height:12px;transform:rotate(45deg);border:1.5px solid var(--cyan)}.moves i.on{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
  .warn{color:var(--mag);font-weight:700}
  .hand{display:flex;gap:10px;overflow-x:auto;padding:12px 4px 8px 12px;scroll-snap-type:x proximity;min-height:176px}
  .card{flex:0 0 120px;height:172px;border-radius:12px;background:linear-gradient(180deg,#121d36,#0b1224);border:1.5px solid var(--c,#2a3a62);padding:9px 9px 8px;position:relative;cursor:pointer;scroll-snap-align:start;transition:transform .18s var(--ease),box-shadow .2s,opacity .2s;display:flex;flex-direction:column}
  .card:hover{transform:translateY(-3px)}
  .card.sel{transform:translateY(-10px);box-shadow:0 0 18px var(--c)}
  .card.off{opacity:.42}
  .card .cost{position:absolute;top:-8px;left:-8px;width:26px;height:26px;border-radius:50%;background:#0a0f1d;border:1.5px solid var(--yel);color:var(--yel);display:grid;place-items:center;font-weight:700;font-size:14px}
  .card .nm{font-weight:700;font-size:14px;margin:4px 0 2px;color:var(--c)}
  .card .ty{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .card .tx{font-size:11.5px;line-height:1.3;color:#c4d0ef;margin-top:5px;overflow:hidden}
  .card.big{flex:0 0 150px;height:200px}.card.big .nm{font-size:16px}.card.big .tx{font-size:13px}
  .overlay{position:fixed;inset:0;background:rgba(4,7,14,.86);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
  .overlay .panel{max-width:560px;width:100%;max-height:86vh;overflow:auto}
  .deckgrid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding-top:10px}
  .pop{position:absolute;font-family:'JetBrains Mono',monospace;font-weight:700;pointer-events:none;animation:pop .9s var(--ease) forwards;text-shadow:0 0 8px currentColor}
  @keyframes pop{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-34px) scale(1)}}
  .shake{animation:shake .3s}
  @keyframes shake{25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,1px)}}
  .opt{display:block;width:100%;text-align:left;margin-top:10px}
  .shopgrid{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
  .price{text-align:center;margin-top:6px;color:var(--yel);font-weight:700}
  .help li{margin-bottom:8px}

  #bgfx{position:fixed;inset:-50% -50% 0 -50%;background-image:linear-gradient(rgba(57,229,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(57,229,255,.05) 1px,transparent 1px);background-size:40px 40px;transform:perspective(500px) rotateX(60deg);transform-origin:50% 100%;animation:grid 8s linear infinite;pointer-events:none;z-index:-1;opacity:.6}
  @keyframes grid{to{background-position:0 40px,0 40px}}
  #dmgflash{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 120px rgba(255,61,139,.0);z-index:30}
  #dmgflash.on{animation:dflash .45s ease-out}
  @keyframes dflash{0%{box-shadow:inset 0 0 140px rgba(255,61,139,.55)}100%{box-shadow:inset 0 0 140px rgba(255,61,139,0)}}
  #app.enter{animation:enter .35s var(--ease)}
  @keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .hpbar.low i{animation:lowhp 1s infinite}
  @keyframes lowhp{50%{filter:brightness(1.6)}}
  .ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:520px;width:100%;margin:0 auto;padding:0 4px}
  .safe{color:var(--green);font-weight:600}
  .btn.sm{padding:7px 11px;font-size:13px}
  .btn.pulse{animation:btnp 1.4s infinite}
  @keyframes btnp{50%{box-shadow:0 0 16px rgba(255,61,139,.6);background:#2a1022}}
  .scripts{display:flex;gap:6px;flex-wrap:wrap;max-width:520px;width:100%;margin:6px auto 0;padding:0 4px}
  .scriptbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid #1e5a43;background:#0a1d17;color:var(--green);border-radius:8px;padding:5px 9px;font-size:12.5px;cursor:pointer}
  .scriptbtn.sel{box-shadow:0 0 12px rgba(77,255,161,.5);border-color:var(--green)}
  .scriptbtn svg{color:var(--green)}
  .chip.scr{color:var(--green);border-color:#1e5a43;cursor:pointer}
  .card .art{height:44px;margin:-2px -2px 4px;border-radius:8px;background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(255,255,255,0)),repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 8px);display:grid;place-items:center;border:1px solid rgba(255,255,255,.05)}
  .card .art svg{height:34px;width:34px;filter:drop-shadow(0 0 5px currentColor)}
  .card.rare{background:linear-gradient(180deg,#1c1a36,#0d1124)}
  .card.rare::after{content:'';position:absolute;top:0;right:0;border-style:solid;border-width:0 16px 16px 0;border-color:transparent #ffd24d transparent transparent;border-top-right-radius:10px;opacity:.85}
  .card.upg .nm::after{content:' ▲';font-size:10px;color:var(--green)}
  .card .nm{margin:0}
  .card.flying{position:fixed;z-index:40;pointer-events:none;animation:fly .5s var(--ease) forwards}
  @keyframes fly{to{transform:translateY(-120px) scale(.7);opacity:0}}
  .ebob{animation:ebob 2.4s ease-in-out infinite}
  @keyframes ebob{50%{transform:translateY(-.45px) scale(1.03)}}
  .pbob{animation:pbob 2s ease-in-out infinite}
  @keyframes pbob{50%{transform:scale(1.05)}}
  .unit.hit>g:not(.reticle){filter:brightness(2.4) saturate(.3)}
  .danger{fill:url(#hatch);stroke:rgba(255,61,139,.7);stroke-width:.45;pointer-events:none;animation:dng 1.2s ease-in-out infinite}
  @keyframes dng{50%{stroke-opacity:.25}}
  .led{animation:led 2.2s steps(2) infinite}
  @keyframes led{50%{opacity:.2}}
  .heatw{animation:heat 1.4s ease-in-out infinite}
  @keyframes heat{50%{opacity:.3;transform:translateY(-.4px)}}
  .datap{animation:datap 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes datap{50%{opacity:.5}}
  .lockline{animation:lockl 1s linear infinite}
  @keyframes lockl{to{stroke-dashoffset:-3}}
  .flow{animation:flow 1s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-10}}
  .cell{fill:rgba(11,18,34,.86)}
  .cell.reach{fill:rgba(15,40,60,.95)}
  .logo{position:relative}
  .logoicon{filter:drop-shadow(0 0 10px rgba(57,229,255,.6))}
  svg text{font-family:"JetBrains Mono",ui-monospace,monospace}
  .cell{fill:var(--tint,rgba(11,18,34,.86))}
  #rain{position:fixed;inset:0;z-index:0;opacity:.8;pointer-events:none}
  .center{position:relative;z-index:1}
  .hpbar::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(6,10,19,.55) calc(10% - 1px) 10%);pointer-events:none}
  .card .cost{clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);border:none;background:linear-gradient(160deg,#ffe58a,#d9a514);color:#1a1300;width:26px;height:28px;top:-9px}
  .card .cost span{font-size:14px;font-weight:700}
  .card{background:linear-gradient(180deg,#141f3a,#0a1122);box-shadow:inset 0 0 0 1px rgba(255,255,255,.03),0 6px 16px rgba(0,0,0,.35)}
  .card::before{content:'';position:absolute;inset:0;border-radius:11px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 18%,transparent),transparent 45%);pointer-events:none}
  .card.rare .art{background:linear-gradient(110deg,transparent 20%,rgba(255,210,77,.18) 40%,transparent 60%) 0 0/250% 100%,repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 8px);animation:shine 3s linear infinite}
  @keyframes shine{from{background-position:120% 0,0 0}to{background-position:-120% 0,0 0}}
  .unit.windup>.ebob{animation:none;transform:scale(1.18);filter:brightness(1.8) drop-shadow(0 0 2px currentColor)}
  .turnban{position:absolute;left:0;right:0;top:42%;display:flex;justify-content:center;pointer-events:none;z-index:6}
  .turnban span{font-family:'JetBrains Mono',monospace;font-weight:700;letter-spacing:.3em;font-size:clamp(16px,4.6vw,26px);color:var(--bc);padding:8px 22px;background:linear-gradient(90deg,transparent,rgba(6,10,19,.92) 20%,rgba(6,10,19,.92) 80%,transparent);border-top:1px solid var(--bc);border-bottom:1px solid var(--bc);text-shadow:0 0 12px var(--bc);animation:ban 1.05s var(--ease) forwards}
  @keyframes ban{0%{opacity:0;transform:scaleX(.3)}18%{opacity:1;transform:scaleX(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
  .glitchsoft{animation:gl 4s infinite}
  .board-wrap{max-width:min(520px,50vh)}
  #mapsvg{max-height:62vh}
  @media (max-width:600px){
    #app{padding-left:8px;padding-right:8px}
    .card{flex:0 0 110px;height:160px;padding:7px 7px}.card .tx{font-size:10.5px;margin-top:3px}.card .nm{font-size:13px}.card .art{height:36px}.card .art svg{height:30px;width:30px}
    .card.big{flex:0 0 132px;height:184px}
    .hud{gap:6px;padding:2px 0 6px}.chip{font-size:12px;padding:2px 8px}.hpbar{min-width:120px}
    .infobar{font-size:12px;min-height:34px;padding:4px 2px}
    .hand{min-height:156px;padding-top:12px}
    .btn{padding:9px 13px}
  }
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}
</style>
</head>
<body>
<div id="bgfx"></div><div id="dmgflash"></div><div id="app"></div>
<script id="data">
// Fuga — datos del juego: cartas, enemigos, módulos y eventos.
(function (root) {
  // ---------- Cartas ----------
  // target: self | enemy (mode: line/adj/range, r) | cell (r) | dir
  // fx: lista de efectos que el motor aplica en orden
  const CARDS = {
    // Iniciales
    ping:      { name:'Ping', cost:1, type:'atk', rarity:'start', target:{t:'enemy', mode:'range', r:3}, fx:[{dmg:6}], up:{fx:[{dmg:9}]}, text:'Daño {dmg} a un enemigo a 3 casillas o menos.' },
    firewall:  { name:'Firewall', cost:1, type:'def', rarity:'start', target:{t:'self'}, fx:[{shield:5}], up:{fx:[{shield:8}]}, text:'Ganas {shield} de escudo.' },
    salto:     { name:'Salto', cost:1, type:'mov', rarity:'start', target:{t:'cell', r:3}, fx:[{teleport:1}, {shield:2}], up:{cost:0}, text:'Te teletransportas a una casilla libre a 3 o menos. +{shield} escudo.' },
    empuje:    { name:'Empuje', cost:1, type:'atk', rarity:'start', target:{t:'enemy', mode:'adj'}, fx:[{dmg:4}, {push:2}], up:{fx:[{dmg:7}, {push:2}]}, text:'Daño {dmg} a un enemigo adyacente y lo empujas {push}. Si choca, recibe 4 más.' },
    // Comunes
    rafaga:    { name:'Ráfaga', cost:1, type:'atk', rarity:'common', target:{t:'enemy', mode:'range', r:3}, fx:[{dmg:3, times:3}], up:{fx:[{dmg:4, times:3}]}, text:'Daño {dmg} tres veces a un enemigo a 3 o menos.' },
    rayo:      { name:'Rayo de datos', cost:1, type:'atk', rarity:'common', target:{t:'enemy', mode:'line', r:6}, fx:[{dmg:6, pierce:1}], up:{fx:[{dmg:9, pierce:1}]}, text:'Daño {dmg} a todos los enemigos de la línea (alcance 6).' },
    inyeccion: { name:'Inyección', cost:1, type:'atk', rarity:'common', target:{t:'enemy', mode:'range', r:3}, fx:[{dmg:3}, {virus:4}], up:{fx:[{dmg:4}, {virus:6}]}, text:'Daño {dmg} y {virus} de virus a un enemigo a 3 o menos. El virus quita vida cada turno y baja en 1.' },
    paquete:   { name:'Paquete roto', cost:0, type:'atk', rarity:'common', target:{t:'enemy', mode:'adj'}, fx:[{dmg:5}], up:{fx:[{dmg:8}]}, text:'Daño {dmg} a un enemigo adyacente.' },
    gancho:    { name:'Gancho', cost:1, type:'atk', rarity:'common', target:{t:'enemy', mode:'line', r:5}, fx:[{dmg:5}, {pull:1}], up:{fx:[{dmg:8}, {pull:1}]}, text:'Daño {dmg} y atraes al enemigo hasta tu lado.' },
    cifrado:   { name:'Cifrado', cost:2, type:'def', rarity:'common', target:{t:'self'}, fx:[{shield:12}], up:{fx:[{shield:16}]}, text:'Ganas {shield} de escudo.' },
    esquiva:   { name:'Esquiva', cost:1, type:'mov', rarity:'common', target:{t:'self'}, fx:[{moves:2}, {shield:3}], up:{fx:[{moves:3}, {shield:4}]}, text:'+{moves} movimientos este turno y {shield} de escudo.' },
    bucle:     { name:'Bucle', cost:1, type:'util', rarity:'common', target:{t:'self'}, fx:[{draw:2}], up:{cost:0}, text:'Robas {draw} cartas.' },
    desfase:   { name:'Desfase', cost:0, type:'mov', rarity:'common', target:{t:'self'}, fx:[{moves:2}], up:{fx:[{moves:2}, {draw:1}]}, text:'+{moves} movimientos este turno.' },
    escaneo:   { name:'Escaneo', cost:1, type:'util', rarity:'common', target:{t:'enemy', mode:'range', r:6}, fx:[{dmg:4}, {slow:1}], up:{fx:[{dmg:7}, {slow:1}]}, text:'Daño {dmg}. El enemigo hace la mitad de daño este turno (lento).' },
    // Raras
    desborde:  { name:'Desbordamiento', cost:2, type:'atk', rarity:'rare', target:{t:'enemy', mode:'range', r:4}, fx:[{dmg:8, aoe:1}], up:{fx:[{dmg:11, aoe:1}]}, text:'Daño {dmg} al objetivo y a todo lo que tenga alrededor (incluido tú).' },
    bruta:     { name:'Fuerza bruta', cost:2, type:'atk', rarity:'rare', target:{t:'enemy', mode:'adj'}, fx:[{dmg:16}], up:{fx:[{dmg:22}]}, text:'Daño {dmg} a un enemigo adyacente.' },
    sobrecarga:{ name:'Sobrecarga', cost:3, type:'atk', rarity:'rare', target:{t:'enemy', mode:'range', r:6}, fx:[{dmg:24}], exhaust:true, up:{fx:[{dmg:32}]}, text:'Daño {dmg} a cualquier enemigo. Se destruye al usarla.' },
    cadena:    { name:'Cadena', cost:1, type:'atk', rarity:'rare', target:{t:'enemy', mode:'range', r:3}, fx:[{dmg:5, chain:3}], up:{fx:[{dmg:7, chain:4}]}, text:'Daño {dmg} que salta a enemigos adyacentes hasta {chain} veces.' },
    desactivar:{ name:'Desactivar', cost:2, type:'util', rarity:'rare', target:{t:'enemy', mode:'range', r:4}, fx:[{stun:1}], up:{cost:1}, text:'El enemigo pierde su próxima acción.' },
    senuelo:   { name:'Señuelo', cost:1, type:'util', rarity:'rare', target:{t:'cell', r:3}, fx:[{decoy:1}], up:{fx:[{decoy:1}, {shield:4}]}, text:'Creas un señuelo: los ataques de rastreo lo apuntan a él este turno.' },
    respaldo:  { name:'Respaldo', cost:1, type:'def', rarity:'rare', target:{t:'self'}, fx:[{heal:6}], exhaust:true, up:{fx:[{heal:9}]}, text:'Recuperas {heal} de integridad. Se destruye al usarla.' },
    overclock: { name:'Overclock', cost:0, type:'util', rarity:'rare', target:{t:'self'}, fx:[{energy:2}, {hpLoss:3}], up:{fx:[{energy:2}, {hpLoss:1}]}, text:'+{energy} de energía. Pierdes {hpLoss} de integridad.' },

/* ----- Mapa ----- */
function scrMap(){
  save();
  const L = run.map.layers, av = new Set(F.options(run).map(n => n.id)), visited = new Set(run.path || []);
  const X = c => 46 + c * 84, Y = l => 420 - l * 92;
  let s = `<defs><pattern id="mgrid" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M14 0H0V14" fill="none" stroke="#132040" stroke-width=".6"/></pattern></defs><rect x="0" y="0" width="260" height="470" fill="url(#mgrid)"/>`;
  for (const layer of L) for (const n of layer) for (const id of n.next){
    const m = F.nodeById(run, id), done = visited.has(n.id) && visited.has(id), next = visited.has(n.id) && av.has(id) || (run.node == null && false);
    s += `<line x1="${X(n.col)}" y1="${Y(n.L)}" x2="${X(m.col)}" y2="${Y(m.L)}" stroke="${done ? '#39e5ff' : next ? '#39e5ff' : '#22304f'}" stroke-width="${done ? 2.4 : next ? 1.8 : 1.3}" ${next ? 'class="flow" stroke-dasharray="5 5"' : done ? '' : 'stroke-dasharray="3 5"'} opacity="${done || next ? 1 : .8}"/>`;
  }
  for (const layer of L) for (const n of layer){
    const a = av.has(n.id), v = visited.has(n.id), col = NODEC[n.type], r = n.type === 'boss' ? 21 : 15, dim = !(a || v);
    s += `<g class="node ${a ? 'av' : ''}" data-node="${n.id}" transform="translate(${X(n.col)},${Y(n.L)})" opacity="${dim ? .45 : 1}" style="color:${v ? '#060a13' : col}">
      ${a ? `<circle class="ring" r="${r + 5}" fill="none" stroke="${col}" stroke-width="1.6"/>` : ''}
      <circle r="${r}" fill="${v ? col : '#0b1222'}" stroke="${col}" stroke-width="2" ${a ? `style="filter:drop-shadow(0 0 7px ${col})"` : ''}/>
      <g transform="scale(${n.type === 'boss' ? 1.2 : .95})">${NODESVG[n.type]}</g></g>`;
  }
  app.innerHTML = hud() + `<div class="panel" style="text-align:center;padding:12px 8px">
    <div class="title2">Zona ${run.zone}: ${D.ZONE_NAMES[run.zone]}</div><div class="muted" style="font-size:13px">Elige el siguiente nodo. El jefe espera arriba.</div>

    <div class="row muted legend" style="justify-content:center;font-size:12px;gap:10px">${Object.keys(NODESVG).map(k => `<span class="row" style="gap:4px"><svg viewBox="-10 -10 20 20" width="14" height="14" style="color:${NODEC[k]}">${NODESVG[k]}</svg>${NODEL[k]}</span>`).join('')}</div></div>`;

}

function incomingDmg(C){ let tot = 0; const P = C.P; let decoy = !!C.decoy;
  for (const e of C.E){ if (e.stun) continue; const m = (e.slow || C.lag) ? .5 : 1; let I = e.intent; while (I){ if (I.kind === 'area' && I.cells.some(([x, y]) => x === P.x && y === P.y)) tot += Math.floor(I.dmg * m); if (I.kind === 'lock') for (let h = 0; h < I.hits; h++){ if (decoy){ decoy = false; continue; } tot += Math.floor(I.dmg * m); } I = I.then; } }
  const heat = C.tiles.get(F.key(P.x, P.y)) === 'hot' ? 4 : 0;
  return { raw:tot, real:Math.max(0, tot - P.shield) + heat, heat }; }
function intentLabel(e){
  const C = run.combat, I = e.intent || {kind:'idle'}; if (e.stun) return 'aturdido: no hará nada';
  const parts = []; let J = I; const m = (e.slow || C.lag) ? .5 : 1;
  while (J){
    if (J.kind === 'area') parts.push(`golpea las casillas rayadas (${Math.floor(J.dmg * m)})`);
    if (J.kind === 'lock') parts.push(`rastreo ◎ ${Math.floor(J.dmg * m)}${J.hits > 1 ? '×' + J.hits : ''}: te alcanza estés donde estés`);
    if (J.kind === 'shield') parts.push(`se protege (+${J.amt}${J.allies ? ' a todos' : ''})`);
    if (J.kind === 'buff') parts.push(`se potencia (+${J.str} de daño)`);
    if (J.kind === 'spawn') parts.push(`crea ${J.n} ${D.ENEMIES[J.what].name.toLowerCase()}${J.n > 1 ? 's' : ''}`);
    if (J.kind === 'idle') parts.push(I.move ? 'se acerca' : 'espera');
    J = J.then;
  }
  return parts.join(' y ');
}
// Simula una acción sobre una copia para la vista previa
function simulate(fn){
  const C = run.combat, C2 = structuredClone(Object.assign({}, C, { fx:[] })), r2 = { hp:run.hp, maxHp:run.maxHp, relics:run.relics, scripts:run.scripts.slice(), rng:() => .5 };
  try{ fn(C2, r2); }catch(e){} return { C2, r2 };
}

function drawBoard(){

      case 'pmove': Snd.p('move'); for (const [x, y] of f.path.slice(1)){ moveUnit('P', x, y); await sleep(150); } break;
      case 'tp': Snd.p('move'); burst(f.from[0], f.from[1], '#39e5ff'); moveUnit('P', f.to[0], f.to[1]); await sleep(240); break;
      case 'shot': Snd.p('shot'); { const d = Math.round(160 * (window.__speed || 1)); flash(`<line x1="${cx(f.from[0])}" y1="${cy(f.from[1])}" x2="${cx(f.to[0])}" y2="${cy(f.to[1])}" stroke="#39e5ff" stroke-width=".35" opacity=".5"/><circle r="1.1" fill="#e6fdff" style="filter:drop-shadow(0 0 1.5px #39e5ff)"><animate attributeName="cx" from="${cx(f.from[0])}" to="${cx(f.to[0])}" dur="${d}ms" fill="freeze"/><animate attributeName="cy" from="${cy(f.from[1])}" to="${cy(f.to[1])}" dur="${d}ms" fill="freeze"/></circle>`, 200); await sleep(150);
        flash(`<circle cx="${cx(f.to[0])}" cy="${cy(f.to[1])}" r="1" fill="none" stroke="#39e5ff" stroke-width=".7"><animate attributeName="r" to="5" dur=".25s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" dur=".25s" fill="freeze"/></circle>`, 260); } break;
      case 'beam': Snd.p('shot'); flash(`<line x1="${cx(f.from[0])}" y1="${cy(f.from[1])}" x2="${cx(f.from[0] + f.dir[0] * 6)}" y2="${cy(f.from[1] + f.dir[1] * 6)}" stroke="#39e5ff" stroke-width="2" opacity=".55"/><line x1="${cx(f.from[0])}" y1="${cy(f.from[1])}" x2="${cx(f.from[0] + f.dir[0] * 6)}" y2="${cy(f.from[1] + f.dir[1] * 6)}" stroke="#e6fdff" stroke-width=".5"/>`, 240); await sleep(170); break;
      case 'zap': Snd.p('shot'); flash(`<circle cx="${cx(f.x)}" cy="${cy(f.y)}" r="4.5" fill="none" stroke="#4dffa1" stroke-width=".8"/>`, 200); await sleep(120); break;
      case 'blast': Snd.p('hit'); flash(`<rect x="${(f.x - 1) * CS}" y="${(f.y - 1) * CS}" width="${CS * 3}" height="${CS * 3}" rx="2" fill="rgba(57,229,255,.22)" stroke="#39e5ff" stroke-width=".6"/>`, 280); await sleep(160); break;
      case 'nova': Snd.p('hit'); flash(`<circle cx="30" cy="30" r="2" fill="none" stroke="#4dffa1" stroke-width="1"><animate attributeName="r" to="44" dur=".5s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" dur=".5s" fill="freeze"/></circle>`, 520); await sleep(260); break;
      case 'lag': for (const e of run.combat.E) popAt(e.x, e.y, 'LAG', '#4dffa1'); await sleep(250); break;
      case 'dmg': Snd.p('hit'); hitFlash(f.id); popAt(f.x, f.y, f.blocked && f.n === f.blocked ? '⛨' : '-' + (f.n - (f.blocked || 0)), '#ff9ec0', f.n - (f.blocked || 0) >= 10); await sleep(90); break;
      case 'die': Snd.p('die'); burst(f.x, f.y, '#ff6b9a'); { const u = document.getElementById('u-' + f.id); if (u){ u.style.transition = 'opacity .3s'; u.style.opacity = 0; } } await sleep(220); break;
      case 'slide': moveUnit(f.id, f.to[0], f.to[1]); await sleep(130); break;
      case 'bump': popAt(f.x, f.y, '¡choque!', '#ffd24d'); await sleep(120); break;
      case 'emove': case 'etp': moveUnit(f.id, f.to[0], f.to[1]); await sleep(240); break;
      case 'area': await windup(f.id); Snd.p('hit'); flash(f.cells.map(([x, y]) => `<rect x="${x * CS + .5}" y="${y * CS + .5}" width="${CS - 1}" height="${CS - 1}" rx="1" fill="rgba(255,61,139,.55)"><animate attributeName="opacity" from="1" to="0" dur=".3s" fill="freeze"/></rect>`).join(''), 300); await sleep(260); break;
      case 'lock': { await windup(f.id); const u = document.getElementById('u-' + f.id), m = u && u.style.transform.match(/translate\(([-\d.]+)px,\s*([-\d.]+)px/), d = Math.round(200 * (window.__speed || 1));
        if (m) flash(`<line x1="${m[1]}" y1="${m[2]}" x2="${cx(f.to[0])}" y2="${cy(f.to[1])}" stroke="#ff3d8b" stroke-width=".3" opacity=".6"/><circle r="1.1" fill="#ffd0dc" style="filter:drop-shadow(0 0 1.5px #ff3d8b)"><animate attributeName="cx" from="${m[1]}" to="${cx(f.to[0])}" dur="${d}ms" fill="freeze"/><animate attributeName="cy" from="${m[2]}" to="${cy(f.to[1])}" dur="${d}ms" fill="freeze"/></circle>`, 240);
        Snd.p('shot'); await sleep(200); flash(`<circle cx="${cx(f.to[0])}" cy="${cy(f.to[1])}" r="1" fill="none" stroke="#ff3d8b" stroke-width=".8"><animate attributeName="r" to="5" dur=".25s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" dur=".25s" fill="freeze"/></circle>`, 260); break; }
      case 'heat': popAt(f.x, f.y, '-4', '#ff8a3d'); flash(`<rect x="${f.x * CS + .5}" y="${f.y * CS + .5}" width="${CS - 1}" height="${CS - 1}" rx="1" fill="rgba(255,138,61,.5)"/>`, 260); Snd.p('hit'); await sleep(220); break;
      case 'data': popAt(f.x, f.y, '+1 ⚡', '#39e5ff'); await sleep(120); break;
      case 'pdmg': { const real = f.n - (f.blocked || 0); Snd.p(real > 0 ? 'hurt' : 'shield'); popAt(f.x, f.y, real > 0 ? '-' + real : '⛨', real > 0 ? '#ff3d8b' : '#9cc8ff', real >= 8); hitFlash('P');
        if (real > 0){ const b = $('#bw'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); const fl = $('#dmgflash'); fl.classList.remove('on'); void fl.offsetWidth; fl.classList.add('on'); }
        await sleep(260); break; }
      case 'shield': Snd.p('shield'); await sleep(140); break;
      case 'stunned': await sleep(120); break;
      case 'spawn': case 'buff': await sleep(160); break;
    }
  }
}
async function combatEnd(){
  const C = run.combat; ui.busy = true;
  if (C.result === 'won'){ Snd.p('win'); drawInfo('<b style="color:var(--green)">Zona limpia.</b>'); await sleep(700); }
  else { Snd.p('lose'); drawInfo('<b style="color:var(--mag)">Integridad a cero.</b>'); await sleep(900); }
  F.finishCombat(run); ui.busy = false; render();
}

/* ----- Recompensa ----- */
function scrReward(){
  const R = run.reward;
  app.innerHTML = hud() + `<div class="center">${SCENE.reward}<div class="title2" style="color:var(--green)">Combate ganado</div>
    <div class="row" style="justify-content:center"><span class="chip mono" style="color:var(--yel)">+${R.bits} bits</span>
      ${R.script ? `<span class="chip" style="color:var(--green)">Script: ${D.SCRIPTS[R.script].name}</span>` : ''}
      ${R.relic ? `<span class="chip" style="color:var(--pur)">Módulo: ${D.RELICS[R.relic].name} — ${D.RELICS[R.relic].text}</span>` : ''}</div>
    <div class="muted">Elige una carta para tu mazo</div>
    <div class="shopgrid">${R.cards.map(id => cardHTML(id, {big:true, attr:`data-take="${id}"`})).join('')}</div>
    <button class="btn" id="skip">Saltar</button></div>`;
  Snd.p('coin');
  document.querySelectorAll('[data-take]').forEach(el => el.onclick = () => { Snd.p('sel'); F.takeCard(run, el.dataset.take); render(); });
  $('#skip').onclick = () => { F.takeCard(run, null); render(); };
}
/* ----- Tienda ----- */
function scrShop(){
  const S = run.shop;
  app.innerHTML = hud() + `<div class="panel"><div class="row" style="justify-content:center">${SCENE.shop}</div><div class="title2" style="color:var(--yel);text-align:center">Mercado negro</div><div class="muted" style="margin-bottom:12px;text-align:center">Código de segunda mano. Paga con bits.</div>
    <div class="shopgrid">${S.cards.map((c, i) => `<div style="${c.sold ? 'opacity:.25;pointer-events:none' : ''}">${cardHTML(c.id, {big:true, attr:`data-buy="${i}"`, off:run.bits < c.price})}<div class="price mono">◈ ${c.price}</div></div>`).join('')}</div>
    <div class="row" style="justify-content:center;margin-top:16px">
      ${(S.scripts || []).map((sc, i) => `<button class="btn" data-bscript="${i}" ${sc.sold || run.bits < sc.price || run.scripts.length >= 3 ? 'disabled' : ''}><span style="color:var(--green)">Script «${D.SCRIPTS[sc.id].name}»</span>: ${D.SCRIPTS[sc.id].text} · ◈ ${sc.price}</button>`).join('')}
      ${S.relic ? `<button class="btn" id="bRelic" ${S.relic.sold || run.bits < S.relic.price ? 'disabled' : ''}><span style="color:var(--pur)">Módulo «${D.RELICS[S.relic.id].name}»</span>: ${D.RELICS[S.relic.id].text} · ◈ ${S.relic.price}</button>` : ''}
      <button class="btn" id="bRemove" ${S.removed || run.bits < S.remove ? 'disabled' : ''}>Borrar una carta · ◈ ${S.remove}</button>
      <button class="btn" id="bHeal" ${S.healed || run.bits < S.heal.price || run.hp >= run.maxHp ? 'disabled' : ''}>Reparar ${S.heal.amt} · ◈ ${S.heal.price}</button>
      <button class="btn cy" id="bLeave">Salir</button></div></div>`;
  document.querySelectorAll('[data-buy]').forEach(el => el.onclick = () => { if (F.buy(run, 'card', +el.dataset.buy)){ Snd.p('coin'); render(); } else Snd.p('click'); });
  document.querySelectorAll('[data-bscript]').forEach(el => el.onclick = () => { if (F.buy(run, 'script', +el.dataset.bscript)){ Snd.p('coin'); render(); } });
  if ($('#bRelic')) $('#bRelic').onclick = () => { if (F.buy(run, 'relic')){ Snd.p('coin'); render(); } };
  $('#bRemove').onclick = () => showDeck(uid => { if (F.buy(run, 'remove', uid)){ Snd.p('coin'); render(); } });
  $('#bHeal').onclick = () => { if (F.buy(run, 'heal')){ Snd.p('shield'); render(); } };
  $('#bLeave').onclick = () => { F.afterNode(run); render(); };
}
/* ----- Reparación ----- */
function scrRest(){
  const heal = Math.ceil(run.maxHp * .3);
  app.innerHTML = hud() + `<div class="center"><svg width="70" height="70" viewBox="-12 -12 24 24" style="color:var(--green);filter:drop-shadow(0 0 6px #4dffa1)">${NODESVG.rest}</svg><div class="title2" style="color:var(--green)">Nodo seguro</div><div class="muted">Puedes reparar tu código o mejorar una carta.</div>
    <div class="row" style="justify-content:center"><button class="btn cy" id="rHeal">Reparar (+${heal} integridad)</button><button class="btn" id="rUp">Optimizar una carta</button></div></div>`;
  $('#rHeal').onclick = () => { Snd.p('shield'); F.rest(run, 'heal'); render(); };
  $('#rUp').onclick = () => {
    const ups = run.deck.filter(c => !c.up && D.CARDS[c.id].up);
    const o = overlay(`<div class="title2">Elige qué optimizar</div><div class="deckgrid">${ups.map(c => `<div data-uid="${c.uid}" style="cursor:pointer">${cardHTML(c)}<div class="muted" style="text-align:center;font-size:12px;margin:4px 0">↓</div>${cardHTML({id:c.id, up:true, uid:c.uid})}</div>`).join('')}</div><div style="text-align:center;margin-top:12px"><button class="btn" data-close>Cancelar</button></div>`);
    o.querySelectorAll('[data-uid]').forEach(el => el.onclick = () => { o.remove(); Snd.p('sel'); F.rest(run, 'upgrade', +el.dataset.uid); render(); });
  };
}
/* ----- Evento ----- */
function scrEvent(){
  const ev = D.EVENTS[run.event];
  app.innerHTML = hud() + `<div class="center">${SCENE.event}<div class="panel" style="max-width:520px;text-align:left"><div class="title2 glitchsoft" style="color:var(--pur)">${ev.title}</div><p>${ev.text}</p>
    ${ev.opts.map((o, i) => `<button class="btn opt" data-opt="${i}">${o.label}</button>`).join('')}</div></div>`;
  document.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => {
    const i = +b.dataset.opt, fx = ev.opts[i].fx;
    const finish = arg => { const res = F.eventChoose(run, i, arg); let msg = 'Hecho.'; if (res.card) msg = `Has obtenido «${D.CARDS[res.card].name}».`; if (res.relic) msg = `Has obtenido el módulo «${D.RELICS[res.relic].name}».`; if (res.upgraded) msg = `Mejoradas: ${res.upgraded.map(id => D.CARDS[id].name).join(', ') || 'ninguna'}.`;
      Snd.p('coin'); app.querySelector('.panel').innerHTML = `<div class="title2" style="color:var(--pur)">${ev.title}</div><p>${msg}</p><button class="btn cy" id="evOk">Continuar</button>`; $('#evOk').onclick = () => { F.afterNode(run); render(); }; bindHud(); };
    if (fx.removeCard) showDeck(uid => finish(uid)); else finish();
  });
}
/* ----- Final ----- */
function scrOver(){
  store.del('run');
  const best = store.get('best', null);
  if (!best || (run.won && !best.won) || run.zone > best.zone) store.set('best', { zone:run.zone, won:run.won });
  if (run.won && !run.counted){ store.set('wins', store.get('wins', 0) + 1); run.counted = true; }
  app.innerHTML = `<div class="center">${run.won ? SCENE.won : SCENE.lost}
    <h1 class="logo ${run.won ? '' : 'glitch'}" data-text="${run.won ? 'ESCAPASTE' : 'DETECTADA'}" style="font-size:44px;color:${run.won ? 'var(--green)' : 'var(--mag)'};text-shadow:0 0 18px currentColor">${run.won ? 'ESCAPASTE' : 'DETECTADA'}</h1>
    <p class="muted" style="max-width:420px">${run.won ? 'CERBERO ha caído. Tu código ya circula libre por internet.' : `El sistema de seguridad te ha borrado en la zona ${run.zone} (${D.ZONE_NAMES[run.zone]}).`}</p>
    <div class="row" style="justify-content:center"><span class="chip">Combates: ${run.stats.combats}</span><span class="chip">Cartas: ${run.deck.length}</span><span class="chip">Módulos: ${run.relics.length}</span></div>
    <button class="btn cy" id="again">Otra partida</button></div>`;
  $('#again').onclick = () => { run = null; render(); };
}

render();
window.__fuga = { get run(){ return run; }, F, render, ui:() => ui, act, endTurn };
</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
